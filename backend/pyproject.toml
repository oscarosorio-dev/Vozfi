[project]
name = "backend-vozfi"
version = "0.1.0"
description = "Es el backend de vozfi donde esta toda la integración de AI y servicios externos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "uvicorn[standard]>=0.50.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "langgraph>=1.2.7",
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-groq>=1.1.3",
    "groq>=0.32.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]